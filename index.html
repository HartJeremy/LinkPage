<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Jeremy Hart</title>
  <meta name="description" content="Quick links, current projects, and a little about Jeremy Hart." />

  <style>
    :root{
      --forest:#0f4a3d; --forest-2:#0a3a31; --forest-3:#073028;
      --mint:#b9f36d; --mint-2:#e1fac6; --cream:#f6f4ed; --paper:#ffffff;
      --season-bg-start:#174f45; --season-bg-end:#f6f4ed;
      --ink:#10352f; --text:#f7fff8; --muted:rgba(255,255,255,.74);
      --muted-dark:rgba(16,53,47,.68); --line:rgba(16,53,47,.13);
      --shadow:0 30px 90px rgba(0,0,0,.28); --shadow-soft:0 18px 50px rgba(16,53,47,.14);
      --radius-xl:34px; --max:1120px;
      --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --serif:ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0; font-family:var(--sans); color:var(--ink);
      background:radial-gradient(700px 420px at 8% 0%, rgba(185,243,109,.24), transparent 62%),
                 linear-gradient(180deg, var(--season-bg-start) 0 360px, var(--season-bg-end) 360px);
      line-height:1.45;
    }
    a{ color:inherit; }
    a:focus-visible, button:focus-visible{ outline:3px solid var(--mint); outline-offset:4px; border-radius:14px; }

    .page{ width:min(var(--max), calc(100% - 30px)); margin:0 auto; padding:36px 0 56px; }
    .site-shell{ border-radius:var(--radius-xl); background:var(--paper); box-shadow:var(--shadow); overflow:hidden; border:1px solid rgba(255,255,255,.24); }

    .utility-bar{
      min-height:30px; padding:6px 34px; background:var(--mint); color:var(--forest-3);
      display:flex; align-items:center; justify-content:center; gap:28px; font-size:.82rem; font-weight:780;
    }
    .utility-bar a{ text-decoration:none; }

    .hero{
      position:relative; color:var(--text); overflow:hidden;
      background:radial-gradient(560px 300px at 78% 20%, rgba(185,243,109,.16), transparent 64%),
                 radial-gradient(600px 360px at 20% 10%, rgba(255,255,255,.05), transparent 58%),
                 var(--forest);
    }
    .hero::before{
      content:""; position:absolute; inset:0; pointer-events:none; opacity:.12;
      background:linear-gradient(135deg, transparent 0 44%, rgba(255,255,255,.20) 45%, transparent 46%),
                 linear-gradient(155deg, transparent 0 56%, rgba(255,255,255,.16) 57%, transparent 58%);
    }

    .nav{ position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:20px; padding:22px 42px 16px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:900; letter-spacing:-.03em; }
    .brand-mark{ width:35px; height:35px; border-radius:50%; display:grid; place-items:center; background:var(--mint); color:var(--forest-3); font-weight:950; letter-spacing:-.08em; }
    .nav-links{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
    .nav-links a{ color:rgba(255,255,255,.86); text-decoration:none; font-size:.9rem; font-weight:750; padding:9px 10px; border-radius:999px; }
    .nav-links a:hover{ background:rgba(255,255,255,.09); color:#fff; }

    .hero-inner{ position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,420px); gap:48px; padding:46px 42px 56px; align-items:center; }
    .eyebrow{ margin:0 0 14px; color:var(--mint); text-transform:uppercase; letter-spacing:.16em; font-size:.78rem; font-weight:950; }
    h1{ margin:0; max-width:720px; font-size:clamp(2.85rem, 6.7vw, 5.45rem); line-height:.96; letter-spacing:-.065em; }
    h1 .accent{ color:var(--mint); position:relative; display:inline-block; }
    h1 .accent::after{ content:""; position:absolute; left:6px; right:-14px; bottom:4px; height:12px; border:2px solid var(--mint); border-color:transparent transparent var(--mint) transparent; border-radius:50%; transform:rotate(-2deg); opacity:.9; }
    .hero-copy{ margin:20px 0 0; max-width:610px; color:var(--muted); font-size:1.04rem; }
    .hero-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:28px; }
    .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:46px; min-width:116px; padding:12px 17px; border-radius:12px; border:1px solid transparent; background:var(--mint); color:var(--forest-3); text-decoration:none; font-weight:850; cursor:pointer; }
    .btn.secondary{ background:transparent; color:#fff; border-color:rgba(255,255,255,.23); }
    .btn:hover{ filter:brightness(1.02); transform:translateY(-1px); }

    .hero-visual{
      position:relative; min-height:360px; border-radius:26px;
      background:radial-gradient(circle at 60% 16%, var(--mint-2), rgba(185,243,109,.55) 32%, rgba(255,255,255,.12) 33%, rgba(255,255,255,.05) 70%),
                 linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.08));
      border:1px solid rgba(255,255,255,.26); box-shadow:0 30px 60px rgba(0,0,0,.22);
      overflow:hidden; display:grid; place-items:center; padding:28px;
    }
    .hero-visual::before{ content:""; position:absolute; right:-16px; top:30px; color:rgba(15,74,61,.12); font-family:var(--serif); font-size:5rem; line-height:.8; letter-spacing:-.08em; font-weight:900; }
    .visual-card{ position:relative; z-index:1; width:100%; max-width:300px; padding:22px; border-radius:24px; background:rgba(255,255,255,.85); color:var(--ink); box-shadow:0 24px 50px rgba(0,0,0,.16); border:1px solid rgba(16,53,47,.10); backdrop-filter:blur(12px); text-decoration:none; }
    .visual-card small{ color:var(--forest); text-transform:uppercase; letter-spacing:.13em; font-size:.74rem; font-weight:950; }
    .visual-card strong{ display:block; margin-top:10px; font-size:1.6rem; line-height:1.08; letter-spacing:-.03em; }
    .visual-card p{ margin:10px 0 0; color:var(--muted-dark); }

    .client-strip{ padding:30px 42px; border-bottom:1px solid var(--line); background:#fff; text-align:center; }
    .client-strip p{ margin:0 0 18px; color:var(--muted-dark); font-weight:760; font-size:.94rem; }
    .mini-nav{ display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
    .mini-nav a{ text-decoration:none; color:rgba(16,53,47,.42); font-weight:900; font-size:1.05rem; }
    .mini-nav a:hover{ color:var(--forest); }

    .section{ padding:68px 42px; background:var(--paper); }
    .section.alt{ background:var(--cream); }
    .section.compact{ padding-top:46px; padding-bottom:46px; }
    .section-head{ max-width:680px; margin:0 auto 32px; text-align:center; }
    .section-head.left{ text-align:left; margin-left:0; margin-right:0; }
    .section-head small, .subsection-head small{ color:var(--forest); text-transform:uppercase; letter-spacing:.15em; font-weight:950; font-size:.75rem; }
    .section-head h2{ margin:8px 0 0; font-size:clamp(2rem, 4vw, 3rem); line-height:1.05; letter-spacing:-.05em; color:var(--ink); }
    .section-head p{ margin:12px 0 0; color:var(--muted-dark); }

    .quick-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .cards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .cards.three{ grid-template-columns:repeat(4,minmax(0,1fr)); }
    .quick-card,.card{ display:block; min-height:100%; padding:20px; border-radius:20px; border:1px solid var(--line); background:#fff; text-decoration:none; box-shadow:var(--shadow-soft); transition:transform .16s ease, box-shadow .16s ease; }
    a.quick-card:hover,a.card:hover{ transform:translateY(-3px); box-shadow:0 22px 60px rgba(16,53,47,.18); }
    .quick-icon,.card-icon{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--mint-2); color:var(--forest-3); font-weight:950; margin-bottom:16px; }
    .quick-card strong,.card strong{ display:block; font-size:1.12rem; line-height:1.15; letter-spacing:-.02em; }
    .quick-card p,.card p{ margin:10px 0 0; color:var(--muted-dark); font-size:.95rem; }
    .primary-contact{ background:var(--forest); color:#fff; border-color:rgba(255,255,255,.18); }
    .primary-contact .quick-icon{ background:var(--mint); color:var(--forest-3); }
    .primary-contact p{ color:rgba(255,255,255,.76); }
    .card-top{ display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .tag{ flex:0 0 auto; border:1px solid var(--line); border-radius:999px; padding:5px 8px; color:var(--muted-dark); font-size:.75rem; font-weight:850; }

    .about-wrap{ display:grid; grid-template-columns:minmax(260px,.85fr) minmax(0,1.15fr); gap:42px; align-items:center; }
    .about-badge{ min-height:380px; border-radius:30px; background:radial-gradient(circle at 35% 24%, rgba(185,243,109,.78), transparent 28%), linear-gradient(135deg, var(--forest), var(--forest-3)); position:relative; overflow:hidden; box-shadow:var(--shadow-soft); color:#fff; padding:28px; display:flex; flex-direction:column; justify-content:flex-end; }
    .about-badge::before{ content:"JH"; position:absolute; left:26px; top:24px; color:rgba(255,255,255,.13); font-size:10rem; line-height:.75; font-family:var(--serif); font-weight:900; letter-spacing:-.08em; }
    .about-badge strong,.about-badge span{ position:relative; z-index:1; }
    .about-badge strong{ font-size:1.45rem; line-height:1.12; }
    .about-badge span{ margin-top:10px; color:rgba(255,255,255,.76); }
    .about-copy p{ color:var(--muted-dark); margin:0 0 14px; font-size:1.02rem; }
    .about-copy p:first-of-type{ color:var(--ink); font-weight:760; font-size:1.12rem; }
    .benefits{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:24px; }
    .benefit{ color:var(--ink); font-weight:830; text-decoration:none; }
    .benefit span{ display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; border-radius:50%; background:var(--mint); color:var(--forest-3); font-size:.78rem; }

    .subsection-head{ margin:42px 0 18px; padding-top:24px; border-top:1px solid var(--line); text-align:left; }
    .subsection-head h3{ margin:8px 0 0; color:var(--ink); font-size:clamp(1.45rem, 3vw, 2.1rem); line-height:1.08; letter-spacing:-.04em; }
    .subsection-head p{ margin:10px 0 0; color:var(--muted-dark); max-width:760px; }
    .show-card{ display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:16px; align-items:start; }
    .show-card .card-icon{ margin-bottom:0; }
    .show-card .card-top,.show-card p{ grid-column:2; }

    .event-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .event{ display:grid; grid-template-columns:86px minmax(0,1fr); gap:14px; padding:18px; border-radius:22px; border:1px solid var(--line); background:#fff; box-shadow:var(--shadow-soft); text-decoration:none; }
    a.event:hover{ transform:translateY(-3px); box-shadow:0 22px 60px rgba(16,53,47,.18); }
    .date{ border-radius:18px; overflow:hidden; border:1px solid var(--line); text-align:center; height:max-content; }
    .date .month{ display:block; padding:7px 4px; background:var(--forest); color:#fff; text-transform:uppercase; letter-spacing:.10em; font-size:.76rem; font-weight:950; }
    .date .day{ display:block; padding:12px 4px 10px; background:var(--mint-2); color:var(--forest-3); font-size:2rem; line-height:.8; font-weight:950; font-family:var(--serif); }
    .event strong{ display:block; font-size:1.16rem; line-height:1.15; }
    .event p{ margin:8px 0 0; color:var(--muted-dark); font-size:.94rem; }
    .event-tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
    .event-tags span{ border:1px solid var(--line); border-radius:999px; padding:5px 9px; color:var(--muted-dark); font-weight:850; font-size:.78rem; }

    .split-section{ display:grid; grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr); gap:46px; align-items:center; }
    .field-visual{ min-height:420px; border-radius:26px; background:radial-gradient(circle at 35% 25%, rgba(185,243,109,.70), transparent 28%), linear-gradient(135deg, var(--forest), var(--forest-3)); position:relative; overflow:hidden; box-shadow:var(--shadow-soft); }
    .field-visual::before{ content:"NOTES"; position:absolute; left:28px; bottom:24px; color:rgba(255,255,255,.12); font-size:7rem; line-height:.8; font-family:var(--serif); font-weight:900; letter-spacing:-.08em; }
    .field-visual::after{ content:"Writing · Training · Reading · Photos"; position:absolute; left:28px; right:28px; top:28px; color:#fff; font-weight:850; font-size:1.35rem; line-height:1.2; }

    .connect-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:26px; }
    .pill{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:11px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink); text-decoration:none; background:#fff; font-weight:850; box-shadow:0 12px 30px rgba(16,53,47,.08); cursor:pointer; }
    .pill:hover{ background:var(--mint-2); }

    footer{ padding:24px 42px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; color:var(--muted-dark); background:#fff; border-top:1px solid var(--line); font-size:.92rem; }
    .drawer{ position:relative; display:inline-block; }
    .drawer-panel{ position:absolute; right:0; bottom:calc(100% + 10px); width:min(360px, calc(100vw - 32px)); padding:14px; border-radius:20px; border:1px solid var(--line); background:#fff; box-shadow:0 22px 70px rgba(16,53,47,.18); z-index:20; }
    .drawer-panel[hidden]{ display:none; }
    .drawer-title{ margin:0 0 10px; color:var(--muted-dark); font-size:.9rem; }
    .drawer-list{ display:grid; gap:9px; }
    .drawer-link{ display:flex; justify-content:space-between; gap:12px; padding:11px 12px; border:1px solid var(--line); border-radius:14px; background:var(--cream); text-decoration:none; color:var(--ink); font-weight:800; }

    @media(max-width:980px){
      .utility-bar{ display:none; }
      .nav{ padding:20px 24px 14px; }
      .nav-links a:nth-child(n+5){ display:none; }
      .hero-inner{ grid-template-columns:1fr; padding:36px 24px 44px; }
      .hero-visual{ min-height:290px; }
      .client-strip,.section,footer{ padding-left:24px; padding-right:24px; }
      .quick-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
      .cards,.cards.three,.event-grid,.split-section,.about-wrap{ grid-template-columns:1fr; }
      .about-badge,.field-visual{ min-height:260px; }
    }

    @media(max-width:620px){
      .page{ width:min(100% - 18px, var(--max)); padding:9px 0 28px; }
      .site-shell{ border-radius:24px; }
      .brand span:last-child{ display:none; }
      .nav-links a:nth-child(n+4){ display:none; }
      h1{ font-size:3rem; }
      .contact-actions .btn{ min-width:calc(50% - 5px); }
      .quick-grid{ grid-template-columns:1fr; }
      .event{ grid-template-columns:72px minmax(0,1fr); }
      .benefits{ grid-template-columns:1fr; }
      .show-card{ display:block; }
      .show-card .card-icon{ margin-bottom:16px; }
      footer{ display:block; }
      footer .connect-row{ justify-content:flex-start; }
      .drawer{ position:static; }
      .drawer-panel{ left:10px; right:10px; width:auto; }
    }

    @media(prefers-reduced-motion:reduce){
      *{ scroll-behavior:auto !important; transition:none !important; }
    }
  
    body,.hero,.utility-bar,.brand-mark,.btn,.quick-icon,.card-icon,.benefit span,.date .month,.date .day,.primary-contact{
      transition:background-color .35s ease, color .35s ease, border-color .35s ease;
    }

  </style>
</head>

<body>
  <div class="page">
    <div class="site-shell">
      <div class="utility-bar" id="utilityBar"></div>
      <header class="hero">
        <nav class="nav" aria-label="Primary navigation">
          <a class="brand" href="#"><span class="brand-mark" id="brandMark">JH</span><span id="brandName">Jeremy Hart</span></a>
          <div class="nav-links" id="topNav"></div>
        </nav>

        <div class="hero-inner">
          <div>
            <p class="eyebrow" id="heroEyebrow"></p>
            <h1 id="heroHeadline"></h1>
            <p class="hero-copy" id="heroIntro"></p>
            <div class="hero-actions contact-actions" id="heroActions" aria-label="Quick contact actions"></div>
          </div>
          <div class="hero-visual" id="heroVisual" aria-label="Featured item"></div>
        </div>
      </header>

      <div class="client-strip">
        <p>Quick sections</p>
        <div class="mini-nav">
          <a href="#quick-links">Quick Links</a>
          <a href="#about">About Me</a>
<a href="#stage-door">Stage Door</a>
          <a href="#planned-activities">Planned Activities</a>
          <a href="#field-notes">Field Notes</a>
          <a href="#useful-links">Useful Links</a>
          <a href="#connect">Connect</a>
        </div>
      </div>

      <main id="mainContent"></main>

      <footer>
        <span>© <span id="year"></span> <span id="footerName"></span></span>
        <div class="connect-row" style="justify-content:flex-start;margin:0;">
          <div class="drawer">
            <button class="pill" id="payBtn" type="button" aria-expanded="false" aria-controls="payPanel">$</button>
            <div class="drawer-panel" id="payPanel" hidden>
              <p class="drawer-title">Payment options</p>
              <div class="drawer-list" id="paymentDrawer"></div>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const fallbackData = null;

    const externalAttrs = item => item.external ? ' target="_blank" rel="noopener"' : '';
    const linkTag = (item, cls, inner) => item.url
      ? `<a class="${cls}" href="${item.url}"${externalAttrs(item)}>${inner}</a>`
      : `<div class="${cls}">${inner}</div>`;


    function parseMonthDay(value){
      const [month, day] = value.split("-").map(Number);
      return { month, day };
    }

    function dateValueForYear(month, day, year){
      return new Date(year, month - 1, day).setHours(0,0,0,0);
    }

    function isInMonthDayRange(today, start, end){
      const year = today.getFullYear();
      const s = parseMonthDay(start);
      const e = parseMonthDay(end);
      const now = new Date(year, today.getMonth(), today.getDate()).setHours(0,0,0,0);
      let startValue = dateValueForYear(s.month, s.day, year);
      let endValue = dateValueForYear(e.month, e.day, year);

      if(startValue <= endValue){
        return now >= startValue && now <= endValue;
      }

      return now >= startValue || now <= endValue;
    }

    function findSeasonalPalette(themes){
      const today = new Date();

      const holidays = themes.holidays || [];
      for(const theme of holidays){
        if(isInMonthDayRange(today, theme.start, theme.end)){
          return theme;
        }
      }

      const month = String(today.getMonth() + 1);
      return (themes.months || {})[month] || themes.default || null;
    }

    function applyPalette(palette){
      if(!palette || !palette.colors) return;
      const root = document.documentElement;
      Object.entries(palette.colors).forEach(([key, value]) => {
        root.style.setProperty(key, value);
      });

      if(palette.name){
        document.documentElement.setAttribute("data-season-theme", palette.name);
      }
    }

    function applySeasonalTheme(themes){
      applyPalette(findSeasonalPalette(themes));
    }




    function visibleItems(items){
      return Array.isArray(items) ? items.filter(item => item.active !== false) : [];
    }

    function hasItems(value){
      return Array.isArray(value) && value.length > 0;
    }

    function navItem(id, label, shouldShow){
      return shouldShow ? `<a href="#${id}">${label}</a>` : "";
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[char]));
    }

    function renderCard(item){
      const inner = `
        <div class="card-icon">${escapeHtml(item.icon || "•")}</div>
        <div class="card-top">
          <strong>${escapeHtml(item.title)}</strong>
          ${item.tag ? `<span class="tag">${escapeHtml(item.tag)}</span>` : ""}
        </div>
        <p>${escapeHtml(item.description)}</p>`;
      return linkTag(item, "card", inner);
    }

    function renderQuickLink(item){
      const inner = `
        <div class="quick-icon">${escapeHtml(item.icon || "•")}</div>
        <strong>${escapeHtml(item.title)}</strong>
        <p>${escapeHtml(item.description)}</p>`;
      return linkTag(item, `quick-card${item.primary ? " primary-contact" : ""}`, inner);
    }

    function renderEvent(item){
      const inner = `
        <div class="date"><span class="month">${escapeHtml(item.month)}</span><span class="day">${escapeHtml(item.day)}</span></div>
        <div>
          <strong>${escapeHtml(item.title)}</strong>
          <p>${escapeHtml(item.details)}</p>
          <p>${escapeHtml(item.note)}</p>
          <div class="event-tags">${(item.tags || []).map(tag => `<span>${escapeHtml(tag)}</span>`).join("")}</div>
        </div>`;
      return linkTag(item, "event", inner);
    }

    function renderSite(data){
      const p = data.profile;

      document.title = `${p.name}`;
      document.getElementById("brandMark").textContent = p.initials;
      document.getElementById("brandName").textContent = p.name;
      document.getElementById("footerName").textContent = p.name;
      document.getElementById("year").textContent = new Date().getFullYear();
      applySeasonalTheme(data.themes || {});

      document.getElementById("utilityBar").innerHTML = `
        <a href="tel:${p.phoneHref}">☎ ${escapeHtml(p.phoneDisplay)}</a>
        <span>Quick question? Text me.</span>
        <a href="${p.contactCard}">Save contact</a>`;

      document.getElementById("heroEyebrow").textContent = p.eyebrow;
      const headline = escapeHtml(p.headline).replace("little about me.", `<span class="accent">little about me.</span>`);
      document.getElementById("heroHeadline").innerHTML = headline;
      document.getElementById("heroIntro").textContent = p.intro;

      document.getElementById("heroActions").innerHTML = `
        <a class="btn" href="${p.contactCard}">Save Contact</a>
        <a class="btn secondary" href="sms:${p.phoneHref}">Text</a>
        <a class="btn secondary" href="mailto:${p.email}">Email</a>
        <a class="btn secondary" href="${p.scheduleUrl}" target="_blank" rel="noopener">Schedule</a>`;


      const stageShows = visibleItems(data.stageDoor?.onStage?.shows);
      const showStageDoor = hasItems(stageShows);
      const showPlannedActivities = hasItems(data.plannedActivities?.items);
      const showFieldNotes = hasItems(data.fieldNotes?.links);
      const showUsefulLinks = hasItems(data.usefulLinks?.links);

      document.getElementById("topNav").innerHTML = [
        navItem("quick-links", "Quick Links", hasItems(data.quickLinks)),
        navItem("about", "About", true),
        navItem("stage-door", "Stage Door", showStageDoor),
        navItem("connect", "Connect", true)
      ].join("");

      document.getElementById("sectionNav").innerHTML = [
        navItem("quick-links", "Quick Links", hasItems(data.quickLinks)),
        navItem("about", "About Me", true),
        navItem("stage-door", "Stage Door", showStageDoor),
        navItem("planned-activities", "Planned Activities", showPlannedActivities),
        navItem("field-notes", "Field Notes", showFieldNotes),
        navItem("useful-links", "Useful Links", showUsefulLinks),
        navItem("connect", "Connect", true)
      ].join("");


      document.getElementById("heroVisual").innerHTML = `
        <a class="visual-card" href="${data.featured.url}" target="_blank" rel="noopener">
          <small>${escapeHtml(data.featured.label)}</small>
          <strong>${escapeHtml(data.featured.title)}</strong>
          <p>${escapeHtml(data.featured.description)}</p>
        </a>`;

      const main = document.getElementById("mainContent");
      main.innerHTML = `
        ${hasItems(data.quickLinks) ? `
        <section class="section compact alt" id="quick-links">
          <div class="section-head">
            <small>Quick Links</small>
            <h2>Find me, message me, or schedule time</h2>
            <p>Fast contact options first, then the rest of the page gives more context.</p>
          </div>
          <div class="quick-grid">${data.quickLinks.map(renderQuickLink).join("")}</div>
        </section>` : ""}

        <section class="section" id="about">
          <div class="about-wrap">
            <div class="about-badge">
              <strong>${escapeHtml(p.aboutBadge)}</strong>
              <span>${escapeHtml(p.aboutTagline)}</span>
            </div>
            <div>
              <div class="section-head left">
                <small>${escapeHtml(p.aboutLabel)}</small>
                <h2>${escapeHtml(p.aboutHeading)}</h2>
              </div>
              <div class="about-copy">${p.aboutParagraphs.map(text => `<p>${escapeHtml(text)}</p>`).join("")}</div>
              <div class="benefits">${p.aboutBullets.map(text => `<div class="benefit"><span>✓</span>${escapeHtml(text)}</div>`).join("")}</div>
            </div>
          </div>
        </section>

        ${showStageDoor ? `
        <section class="section" id="stage-door">
          <div class="section-head">
            <small>${escapeHtml(data.stageDoor.label)}</small>
            <h2>${escapeHtml(data.stageDoor.onStage.heading)}</h2>
            <p>${escapeHtml(data.stageDoor.onStage.description)}</p>
          </div>
          <div class="cards">
            ${stageShows.map(show => linkTag({
              url: show.url,
              external: true
            }, "card show-card", `
              <div class="card-icon">🎭</div>
              <div class="card-top"><strong>${escapeHtml(show.title)}</strong><span class="tag">${escapeHtml(show.status)}</span></div>
              <p>${escapeHtml(show.date)} · ${escapeHtml(show.location)}</p>
              ${show.times ? `<p><strong style="font-size:.95rem;">Times:</strong> ${escapeHtml(show.times)}</p>` : ""}
              <p><strong style="font-size:.95rem;">Role:</strong> ${escapeHtml(show.role)}</p>
            `)).join("")}
          </div>
        </section>` : ""}

        ${showPlannedActivities ? `
        <section class="section alt" id="planned-activities">
          <div class="section-head">
            <small>${escapeHtml(data.plannedActivities.label)}</small>
            <h2>${escapeHtml(data.plannedActivities.heading)}</h2>
            <p>${escapeHtml(data.plannedActivities.description)}</p>
          </div>
          <div class="event-grid">${data.plannedActivities.items.map(renderEvent).join("")}</div>
        </section>` : ""}

        ${showFieldNotes ? `
        <section class="section" id="field-notes">
          <div class="split-section">
            <div class="field-visual" aria-hidden="true"></div>
            <div>
              <div class="section-head left">
                <small>${escapeHtml(data.fieldNotes.label)}</small>
                <h2>${escapeHtml(data.fieldNotes.heading)}</h2>
                <p>${escapeHtml(data.fieldNotes.description)}</p>
              </div>
              <div class="benefits">${data.fieldNotes.links.map(link => `<a class="benefit" href="${link.url}" target="_blank" rel="noopener"><span>✓</span>${escapeHtml(link.title)}</a>`).join("")}</div>
            </div>
          </div>
        </section>` : ""}

        ${showUsefulLinks ? `
        <section class="section alt" id="useful-links">
          <div class="section-head">
            <small>${escapeHtml(data.usefulLinks.label)}</small>
            <h2>${escapeHtml(data.usefulLinks.heading)}</h2>
            <p>${escapeHtml(data.usefulLinks.description)}</p>
          </div>
          <div class="cards three">${data.usefulLinks.links.map(item => renderCard({...item, external:true})).join("")}</div>
        </section>` : ""}

        <section class="section" id="connect">
          <div class="section-head">
            <small>Connect</small>
            <h2>Reach me directly</h2>
            <p>Quick question? Text me. Anything longer, email. Scheduling is here too.</p>
          </div>
          <div class="connect-row">
            <a class="pill" href="tel:${p.phoneHref}">Call</a>
            <a class="pill" href="sms:${p.phoneHref}">Text</a>
            <a class="pill" href="mailto:${p.email}">Email</a>
            <a class="pill" href="${p.scheduleUrl}" target="_blank" rel="noopener">Schedule time</a>
            <a class="pill" href="${p.contactCard}">Add to contacts</a>
          </div>
        </section>
      `;

      document.getElementById("paymentDrawer").innerHTML = data.payments.map(item => `
        <a class="drawer-link" href="${item.url}" target="_blank" rel="noopener">
          <strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.description)}</span>
        </a>`).join("");

      const payBtn = document.getElementById("payBtn");
      const payPanel = document.getElementById("payPanel");
      function closePay(){ payBtn.setAttribute("aria-expanded","false"); payPanel.hidden = true; }
      function openPay(){ payBtn.setAttribute("aria-expanded","true"); payPanel.hidden = false; }
      payBtn.addEventListener("click", event => { event.stopPropagation(); payPanel.hidden ? openPay() : closePay(); });
      payPanel.addEventListener("click", event => event.stopPropagation());
      document.addEventListener("click", closePay);
      document.addEventListener("keydown", event => { if(event.key === "Escape") closePay(); });
    }

    fetch("data.json")
      .then(response => {
        if(!response.ok) throw new Error("Could not load data.json");
        return response.json();
      })
      .then(renderSite)
      .catch(error => {
        document.body.innerHTML = `<main style="font-family:system-ui;padding:32px;max-width:720px;margin:auto;">
          <h1>Could not load data.json</h1>
          <p>This version uses a separate data.json file. If you opened index.html directly from your computer, run it through a local server or upload both files to GitHub Pages.</p>
          <p><code>python3 -m http.server</code></p>
        </main>`;
        console.error(error);
      });
  </script>
</body>
</html>
